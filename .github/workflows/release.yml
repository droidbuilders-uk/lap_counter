name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Build and Package Script
        run: |
          chmod +x scripts/create_deb.sh
          TARGET_ARCH=${{ matrix.arch }} ./scripts/create_deb.sh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            lapcounter_*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update APT Repository
        uses: petersandor/apt-repo-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_name: 'lap_counter'
          file: 'lapcounter_*.deb'
          branch: 'gh-pages'
          dist: 'stable'
          component: 'main'
          arch: ${{ matrix.arch }}
